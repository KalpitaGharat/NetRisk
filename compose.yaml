services:
  netrisk:
    build: .
    image: netrisk:2.0
    container_name: netrisk-app
    ports:
      - "8001:8000"
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
